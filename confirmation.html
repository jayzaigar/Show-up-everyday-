<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>You're In: The Show Up Everyday Series</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="confirm-wrap">
  <div class="stars-layer" aria-hidden="true">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>
  </div>
  <div class="confirm-card">
    <div class="confirm-icon">You're in</div>
    <h1 id="confirm-heading">Thank you for registering.</h1>
    <p>One step left: join the WhatsApp group below to lock in your spot for The Show Up Everyday Series.</p>
    <a href="join-whatsapp-free.html" id="join-whatsapp-link" class="btn btn-primary btn-lg">Continue</a>
  </div>
</div>

<footer class="site-footer">
  <p>&copy; SSELFIE.ai · The Show Up Everyday Series</p>
</footer>

<script src="js/site.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const rid = params.get('rid');
  if (name) {
    document.getElementById('confirm-heading').textContent = `Thank you for registering, ${name}.`;
  }

  const joinLink = document.getElementById('join-whatsapp-link');
  const query = new URLSearchParams();
  if (name) query.set('name', name);
  if (rid) query.set('rid', rid);
  if (query.toString()) joinLink.href = `${joinLink.getAttribute('href')}?${query.toString()}`;
</script>
</body>
</html>
