<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Registrations Dashboard: The Show Up Everyday Series</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!--
  INTERNAL PAGE, not part of the funnel. Polls Airtable every 30s and
  renders registrants in the site's own look, instead of embedding
  Airtable's UI. See the README's "Registrations dashboard" section for
  setup. This page has no login of its own, only an unlisted URL, so
  don't link to it from anywhere public.
-->

<!--
  LOGIN GATE: client-side only, since this is a static site with no server.
  This stops a casual visitor who finds the link, it is NOT real security,
  the username/password check below runs in this page's own JavaScript, so
  anyone who opens dev tools or views source can read it directly. See the
  README for the tradeoffs.
-->
<div id="dash-login" class="confirm-wrap">
  <div class="confirm-card">
    <div class="confirm-icon">Internal</div>
    <h1>Sign in</h1>
    <p>This dashboard is restricted to Jay and Sandra.</p>
    <form id="dash-login-form" class="register-form" novalidate>
      <div class="form-row">
        <label for="dash-username">Username</label>
        <input type="text" id="dash-username" autocomplete="username" required>
      </div>
      <div class="form-row">
        <label for="dash-password">Password</label>
        <input type="password" id="dash-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-full">Enter</button>
    </form>
  </div>
</div>

<div id="dash-content" style="display: none;">
  <header class="section" style="padding-block: 48px 12px;">
    <div class="container narrow center">
      <span class="eyebrow center">Internal</span>
      <h1>Registrations dashboard</h1>
      <p class="subhead">Everyone who's registered for The Show Up Everyday Series. Refreshes automatically every 30 seconds.</p>
      <div class="dash-refresh" id="dash-refresh">
        <span class="dash-refresh-dot" aria-hidden="true"></span>
        <span id="dash-refresh-text">Loading&hellip;</span>
      </div>
    </div>
  </header>

  <main class="container" style="padding-block: 20px 60px;">
    <div id="dash-root"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; SSELFIE.ai &middot; The Show Up Everyday Series &middot; <a href="#" id="dash-logout" style="text-decoration: underline;">Log out</a></p>
  </footer>
</div>

<script>
  // A separate, read-only Personal Access Token (scope: data.records:read,
  // restricted to this one base). This is deliberately NOT the same token
  // used in js/site.js: that one is write-only so it's safe to expose on
  // every public funnel page. This page needs read access to show
  // registrants, so that access is confined to just this one unlisted page
  // rather than every visitor of the public site. See the README.
  const AIRTABLE_BASE_ID = 'appiomSorktNJKzAK';
  const AIRTABLE_TABLE_NAME = 'tblKK43dOhOtkMdaF';
  const AIRTABLE_READ_TOKEN = '';
  const AIRTABLE_OPEN_URL = 'https://airtable.com/appiomSorktNJKzAK/shrDqD9WAmGyOOrTA'; // optional: your Airtable "Share view" link, for the "Open in Airtable" fallback

  const REFRESH_MS = 30000;

  const root = document.getElementById('dash-root');
  const refreshText = document.getElementById('dash-refresh-text');

  let allRecords = [];
  let lastFetchAt = null;
  let filterCountry = '';
  let filterTier = 'all'; // all | vip | free
  let filterSearch = '';

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  async function fetchAllRecords() {
    const records = [];
    let offset = null;
    do {
      const url = new URL(`https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}`);
      url.searchParams.set('pageSize', '100');
      if (offset) url.searchParams.set('offset', offset);
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${AIRTABLE_READ_TOKEN}` },
      });
      if (!res.ok) throw new Error(`Airtable responded ${res.status}`);
      const data = await res.json();
      records.push(...data.records);
      offset = data.offset || null;
    } while (offset);
    return records;
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) +
      ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function render() {
    const total = allRecords.length;
    const vipCount = allRecords.filter((r) => !!r.fields.VIP).length;
    const freeCount = total - vipCount;

    const countryCounts = new Map();
    allRecords.forEach((r) => {
      const c = (r.fields.Country || 'Unknown').trim() || 'Unknown';
      countryCounts.set(c, (countryCounts.get(c) || 0) + 1);
    });
    const sortedCountries = Array.from(countryCounts.entries()).sort((a, b) => b[1] - a[1]);

    let filtered = allRecords;
    if (filterCountry) filtered = filtered.filter((r) => (r.fields.Country || 'Unknown').trim() === filterCountry);
    if (filterTier === 'vip') filtered = filtered.filter((r) => !!r.fields.VIP);
    if (filterTier === 'free') filtered = filtered.filter((r) => !r.fields.VIP);
    if (filterSearch) {
      const q = filterSearch.toLowerCase();
      filtered = filtered.filter((r) => {
        const name = (r.fields['First Name'] || '').toLowerCase();
        const email = (r.fields.Email || '').toLowerCase();
        return name.includes(q) || email.includes(q);
      });
    }
    filtered = filtered.slice().sort((a, b) => new Date(b.createdTime) - new Date(a.createdTime));

    const countryOptions = ['<option value="">All countries</option>']
      .concat(sortedCountries.map(([c]) => `<option value="${escapeHtml(c)}"${c === filterCountry ? ' selected' : ''}>${escapeHtml(c)}</option>`))
      .join('');

    const rows = filtered.map((r) => {
      const f = r.fields;
      const isVip = !!f.VIP;
      return `
        <tr>
          <td class="dash-col-name">${escapeHtml(f['First Name'] || '')}</td>
          <td>${escapeHtml(f.Email || '')}</td>
          <td>${escapeHtml(f.WhatsApp || '')}</td>
          <td>${escapeHtml(f.Country || '')}</td>
          <td class="${isVip ? 'dash-status-vip' : 'dash-status-free'}">${isVip ? 'VIP' : 'Free'}</td>
          <td title="${escapeHtml(f.Q1 || '')}">${escapeHtml(f.Q1 || '')}</td>
          <td title="${escapeHtml(f.Q4 || '')}">${escapeHtml(f.Q4 || '')}</td>
          <td>${escapeHtml(formatDate(r.createdTime))}</td>
        </tr>`;
    }).join('');

    root.innerHTML = `
      <div class="dash-stats">
        <div class="dash-stat"><span class="dash-stat-label">Total registrations</span><span class="dash-stat-value">${total}</span></div>
        <div class="dash-stat"><span class="dash-stat-label">VIP</span><span class="dash-stat-value">${vipCount}</span></div>
        <div class="dash-stat"><span class="dash-stat-label">Free</span><span class="dash-stat-value">${freeCount}</span></div>
        <div class="dash-stat"><span class="dash-stat-label">Countries reached</span><span class="dash-stat-value">${countryCounts.size}</span></div>
      </div>

      ${sortedCountries.length ? `
        <div class="dash-countries">
          ${sortedCountries.map(([c, n]) => `<div class="dash-country-row"><span>${escapeHtml(c)}</span><strong>${n}</strong></div>`).join('')}
        </div>
      ` : ''}

      <div class="dash-controls">
        <div class="dash-filter-row">
          <select id="dash-country-filter">${countryOptions}</select>
          <div class="dash-toggle-group">
            <button type="button" class="dash-toggle${filterTier === 'all' ? ' is-active' : ''}" data-tier="all">All</button>
            <button type="button" class="dash-toggle${filterTier === 'vip' ? ' is-active' : ''}" data-tier="vip">VIP</button>
            <button type="button" class="dash-toggle${filterTier === 'free' ? ' is-active' : ''}" data-tier="free">Free</button>
          </div>
          <input type="search" id="dash-search" placeholder="Search name or email" value="${escapeHtml(filterSearch)}">
          ${AIRTABLE_OPEN_URL ? `<a href="${escapeHtml(AIRTABLE_OPEN_URL)}" target="_blank" rel="noopener" class="microcopy" style="text-decoration: underline; margin-left: auto;">Open in Airtable</a>` : ''}
        </div>
      </div>

      ${filtered.length ? `
        <div class="dash-table-wrap">
          <table class="dash-table">
            <thead>
              <tr>
                <th>Name</th><th>Email</th><th>WhatsApp</th><th>Country</th><th>Tier</th>
                <th>Q1: describes them</th><th>Q4: goal for the 5 days</th><th>Registered</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      ` : `<div class="dash-empty">No registrants match this filter yet.</div>`}
    `;

    document.getElementById('dash-country-filter').addEventListener('change', (e) => {
      filterCountry = e.target.value;
      render();
    });
    document.getElementById('dash-search').addEventListener('input', (e) => {
      filterSearch = e.target.value;
      render();
    });
    root.querySelectorAll('.dash-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        filterTier = btn.dataset.tier;
        render();
      });
    });
  }

  function tickRefreshLabel() {
    if (!lastFetchAt) return;
    const secs = Math.round((Date.now() - lastFetchAt) / 1000);
    refreshText.textContent = secs < 5 ? 'Updated just now' : `Updated ${secs}s ago`;
  }

  async function load() {
    try {
      allRecords = await fetchAllRecords();
      lastFetchAt = Date.now();
      render();
      tickRefreshLabel();
    } catch (err) {
      console.error('Dashboard fetch failed', err);
      if (!allRecords.length) {
        root.innerHTML = '<div class="dash-error">Could not load registrants. Check the console for details, and that your read-only token and base/table IDs in dashboard.html are correct.</div>';
      }
      refreshText.textContent = 'Update failed, showing last known data';
    }
  }

  function startDashboard() {
    if (AIRTABLE_BASE_ID && AIRTABLE_TABLE_NAME && AIRTABLE_READ_TOKEN) {
      load();
      setInterval(load, REFRESH_MS);
      setInterval(tickRefreshLabel, 1000);
    } else {
      root.innerHTML = '<div class="dash-empty">Not set up yet. Create a read-only Personal Access Token (scope: data.records:read, restricted to your base) and paste your Base ID, table ID, and token into the constants near the top of dashboard.html’s script. See the README’s "Registrations dashboard" section.</div>';
      refreshText.textContent = 'Not configured';
    }
  }

  // ---------- Login gate (see the notice in the HTML above) ----------
  const VALID_LOGINS = { jay: 'AI2026', sandra: 'AI2026' };
  const AUTH_KEY = 'dash-authed';

  const loginScreen = document.getElementById('dash-login');
  const contentScreen = document.getElementById('dash-content');
  const loginForm = document.getElementById('dash-login-form');
  const logoutLink = document.getElementById('dash-logout');

  function showContent() {
    loginScreen.style.display = 'none';
    contentScreen.style.display = '';
    startDashboard();
  }

  function showLogin() {
    contentScreen.style.display = 'none';
    loginScreen.style.display = '';
  }

  function showLoginError(message) {
    const existing = document.getElementById('dash-login-error');
    if (existing) existing.remove();
    const error = document.createElement('p');
    error.id = 'dash-login-error';
    error.className = 'form-error';
    error.textContent = message;
    loginForm.appendChild(error);
  }

  loginForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const username = document.getElementById('dash-username').value.trim().toLowerCase();
    const password = document.getElementById('dash-password').value;
    if (VALID_LOGINS[username] && VALID_LOGINS[username] === password) {
      localStorage.setItem(AUTH_KEY, 'true');
      showContent();
    } else {
      showLoginError('Incorrect username or password.');
    }
  });

  logoutLink.addEventListener('click', (event) => {
    event.preventDefault();
    localStorage.removeItem(AUTH_KEY);
    window.location.reload();
  });

  if (localStorage.getItem(AUTH_KEY) === 'true') {
    showContent();
  } else {
    showLogin();
  }
</script>
</body>
</html>
